<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    <table align="center" style="width: 950px;" border="0" cellpadding="0" cellspacing="0">
        <tr>
            <td width="38%" style="background-color:#1f356f; padding: 2px 14px; color:#ffffff;">
                <table border="0" cellpadding="0" cellspacing="0" style="width:100%;">
                    <tr>
                        <td width="100%" align="left">
                            <Label style="font-family:Helvetica;font-size:14pt;font-weight:normal;color:#ffffff;">PERFIL NUTRICIONAL</Label>
                        </td>
                    </tr>
                </table>
            </td>
            <td width="20%" style="border: solid 1px #d6deed; padding: 2px 10px;" align="center">
                <Label style="font-family:Helvetica;font-size:9pt;font-weight:bold;color:#2d4998;">CLIENTE</Label>
                <br />
                <Label style="font-family:Helvetica;font-size:9pt;font-weight:bold;color:#111827;">@@Cliente</Label>
            </td>
            <td width="24%" style="border: solid 1px #d6deed; padding: 2px 10px;" align="center">
                <Label style="font-family:Helvetica;font-size:9pt;font-weight:bold;color:#2d4998;">REFERENCIA</Label>
                <br />
                <Label style="font-family:Helvetica;font-size:9pt;font-weight:bold;color:#111827;">@@Referencia</Label>
            </td>
            <td width="18%" style="border: solid 1px #d6deed; padding: 2px 10px;" align="center">
                <Label style="font-family:Helvetica;font-size:9pt;font-weight:bold;color:#2d4998;">FECHA EMISION:</Label>
                <br />
                <Label style="font-family:Helvetica;font-size:9pt;font-weight:bold;color:#111827;">@@FechaEmision</Label>
            </td>
        </tr>
    </table>
    <div style="height:18px;"></div>
    <table align="center" style="width: 950px; border-collapse: collapse; table-layout: fixed;" border="1" cellpadding="0" cellspacing="0">
        <tr bgcolor="#273f6b">
            <td style="border: solid 1px #cbd5e1; padding: 2px 6px; width: 200px" align="center">
                <Label style="font-family:Helvetica;font-size:8pt;font-weight:normal;color:#ffffff; ">ETAPA</Label>
            </td>
            @@ColumnHeaders
        </tr>
        @@TableRows
    </table>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    <table align="center" style="width: 950px;" border="0" cellpadding="0" cellspacing="0">
        <tr>
            <td style="background-color:#0b2e57; padding: 12px 16px; color: #ffffff; ">
                <table border="0" cellpadding="0" cellspacing="0" style="width:100%;">
                    <tr>
                        <td style="width:70px; vertical-align:middle;">
                            <img src="@@LeftLogo" style="width:58px; height:auto;" />
                        </td>
                        <td style="vertical-align:middle;">
                            <div style="font-family:Helvetica;font-size:14pt;font-weight:normal;color:#ffffff; margin-bottom:6px;">@@Titulo</div>
                            <div style="font-family:Helvetica;font-size:9pt;font-weight:normal;color:#61a7ff; margin-bottom:2px;">@@FolioReferencia</div>
                            <div style="font-family:Helvetica;font-size:9pt;font-weight:bold;color:#ffffff; margin-bottom:2px;">@@ClienteHeader</div>                            
                        </td>
                        <td style="width:240px; text-align:right; vertical-align:top;">
                            <img src="@@RightLogo" style="width:220px; height:auto;" />
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
    <div style="height:18px;"></div>
    <table align="center" style="width: 950px; border-collapse: collapse; table-layout: fixed;" border="1" cellpadding="0" cellspacing="0">
        <tr bgcolor="#0b2e57">
            <td style="border: solid 1px #cbd5e1; padding: 2px 6px; width: 200px" align="center">
                <Label style="font-family:Helvetica;font-size:8pt;font-weight:normal;color:#ffffff; ">&nbsp;</Label>
            </td>
            @@ColumnHeaders
        </tr>
        @@TableRows
    </table>
</body>
</html>
